<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2530;--muted:#6b7684;--grid:#e8edf2;--snake:#22a06b;--head:#157a4f;--food:#e5484d;--btn:#e3e9ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2129;--text:#e8edf2;--muted:#8d99a8;--grid:#232b35;--snake:#3ecf8e;--head:#7ff0b9;--food:#ff6369;--btn:#2a333e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2129;--text:#e8edf2;--muted:#8d99a8;--grid:#232b35;--snake:#3ecf8e;--head:#7ff0b9;--food:#ff6369;--btn:#2a333e;color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px;text-align:center}
h1{margin:4px 0 10px;font-size:1.6rem}
.bar{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:8px;font-size:.95rem}
.bar b{color:var(--text)}
.board{position:relative;background:var(--card);border-radius:14px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none}
.over{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:8px}
.over[hidden]{display:none}
.over p{margin:0;font-size:1.2rem}
button{font:inherit;border:0;border-radius:10px;background:var(--btn);color:var(--text);cursor:pointer}
.start{background:var(--snake);color:#fff;padding:10px 24px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:14px}
.pad button{font-size:1.3rem}
.up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 Змейка</h1>
  <div class="bar"><span>Счёт: <b id="score">0</b></span><span>Рекорд: <b id="best">0</b></span></div>
  <div class="board">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="over" id="over"><p id="msg">Готовы?</p><button class="start" id="go">Играть</button></div>
  </div>
  <div class="pad">
    <button class="up" data-d="U">▲</button>
    <button class="left" data-d="L">◀</button>
    <button class="down" data-d="D">▼</button>
    <button class="right" data-d="R">▶</button>
  </div>
  <div class="hint">Стрелки, WASD или свайпы · Пробел — пауза</div>
</div>
<script>
(function(){
  var N=20,S=20,cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  var over=document.getElementById('over'),msg=document.getElementById('msg'),go=document.getElementById('go');
  var snake,dir,next,food,score,timer,running=false,paused=false,best=0;
  try{best=parseInt(localStorage.getItem('snake-best')||'0',10)||0}catch(e){}
  bestEl.textContent=best;
  var V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function place(){
    do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
    while(snake.some(function(s){return s.x===food.x&&s.y===food.y}));
  }
  function start(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir='R';next='R';score=0;scoreEl.textContent=0;
    place();running=true;paused=false;over.hidden=true;
    clearInterval(timer);timer=setInterval(tick,115);draw();
  }
  function turn(d){
    var o={U:'D',D:'U',L:'R',R:'L'};
    if(d!==o[dir])next=d;
  }
  function end(){
    running=false;clearInterval(timer);
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snake-best',String(best))}catch(e){}}
    msg.textContent='Игра окончена: '+score;go.textContent='Ещё раз';over.hidden=false;
  }
  function tick(){
    if(paused)return;
    dir=next;var h=snake[0],v=V[dir],n={x:h.x+v[0],y:h.y+v[1]};
    if(n.x<0||n.y<0||n.x>=N||n.y>=N||snake.some(function(s){return s.x===n.x&&s.y===n.y}))return end();
    snake.unshift(n);
    if(n.x===food.x&&n.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,400,400);
    ctx.fillStyle=css('--grid');
    for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)%2===0)ctx.fillRect(i*S,j*S,S,S);
    ctx.fillStyle=css('--food');ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);ctx.fill();
    snake.forEach(function(s,i){
      ctx.fillStyle=i===0?css('--head'):css('--snake');
      ctx.beginPath();ctx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,5);ctx.fill();
    });
  }
  go.onclick=start;
  document.addEventListener('keydown',function(e){
    var m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R'};
    if(m[e.key]){e.preventDefault();if(!running)return;turn(m[e.key])}
    else if(e.key===' '){e.preventDefault();if(running){paused=!paused}else start()}
  });
  document.querySelectorAll('.pad button').forEach(function(b){
    b.onclick=function(){if(running)turn(b.dataset.d)};
  });
  var sx,sy;
  cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',function(e){
    if(!running)return;
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));
  });
  snake=[{x:10,y:10}];food={x:14,y:10};draw();
})();
</script>
</body>
</html>
